name: Automatic Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: automatic-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Create GitHub release
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Define release version
        id: version
        shell: bash
        run: |
          TAG="v1.0.${GITHUB_RUN_NUMBER}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "archive=wFileManager-Website-${TAG}.zip" >> "$GITHUB_OUTPUT"

      - name: Create source archive
        shell: bash
        run: |
          git archive \
            --format=zip \
            --output="${{ steps.version.outputs.archive }}" \
            HEAD

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          ARCHIVE: ${{ steps.version.outputs.archive }}
        shell: bash
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; nothing to create."
            exit 0
          fi

          gh release create "$TAG" "$ARCHIVE" \
            --target "$GITHUB_SHA" \
            --title "wFileManager Website $TAG" \
            --generate-notes \
            --latest
